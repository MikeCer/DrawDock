<text x="40" y="1306" text-anchor="start" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="16"><tspan x="40" dy="0">Missing identity, monitor or valid document: stop with an error and retain saved work.</tspan><tspan x="40" dy="20.0">Explicit Disconnect stops retries; app-data clearing/uninstall removes local documents.</tspan></text></svg>
