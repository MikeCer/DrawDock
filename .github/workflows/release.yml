name: Tagged release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $release = .\packaging\Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "code=$($release.VersionCode)" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        run: .\tests\Test-ReleaseVersion.ps1

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            make nasm diffutils
      - name: Build native runtime and package source
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: .\packaging\windows\Build-Runtime.ps1 -MsysRoot $env:MSYS_ROOT
      - name: Prepare pinned portable NSIS
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          Invoke-WebRequest 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne
              'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') {
            throw 'NSIS checksum mismatch'
          }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'nsis')
      - name: Build Windows installer
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          .\packaging\windows\Package-Windows.ps1 -Version $env:RELEASE_VERSION `
            -NsisExecutable "$env:RUNNER_TEMP\nsis\nsis-3.11\makensis.exe"
      - name: Verify install and uninstall on the disposable runner
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: .\tests\Test-WindowsInstaller.ps1 -Installer "$PWD\dist\DrawDock-$env:RELEASE_VERSION-windows-x64-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '9.4.1'
      - name: Build and verify signed APK
        shell: pwsh
        working-directory: android
        env:
          DRAWDOCK_VERSION: ${{ needs.version.outputs.version }}
          DRAWDOCK_VERSION_CODE: ${{ needs.version.outputs.code }}
          DRAWDOCK_ANDROID_KEYSTORE_BASE64: ${{ secrets.DRAWDOCK_ANDROID_KEYSTORE_BASE64 }}
          DRAWDOCK_ANDROID_STORE_PASSWORD: ${{ secrets.DRAWDOCK_ANDROID_STORE_PASSWORD }}
          DRAWDOCK_ANDROID_KEY_ALIAS: ${{ secrets.DRAWDOCK_ANDROID_KEY_ALIAS }}
          DRAWDOCK_ANDROID_KEY_PASSWORD: ${{ secrets.DRAWDOCK_ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in 'DRAWDOCK_ANDROID_KEYSTORE_BASE64', 'DRAWDOCK_ANDROID_STORE_PASSWORD',
              'DRAWDOCK_ANDROID_KEY_ALIAS', 'DRAWDOCK_ANDROID_KEY_PASSWORD') {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Required secret missing: $name" }
          }
          $env:DRAWDOCK_ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP 'android-release.p12'
          [IO.File]::WriteAllBytes($env:DRAWDOCK_ANDROID_KEYSTORE,
            [Convert]::FromBase64String($env:DRAWDOCK_ANDROID_KEYSTORE_BASE64))
          try {
            & gradle --no-daemon testDebugUnitTest assembleRelease lintRelease
            if ($LASTEXITCODE -ne 0) { throw 'Android release build failed' }
            & "$env:ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs `
              app/build/outputs/apk/release/app-release.apk
            if ($LASTEXITCODE -ne 0) { throw 'Android signature verification failed' }
            New-Item -ItemType Directory -Force ../dist | Out-Null
            Copy-Item app/build/outputs/apk/release/app-release.apk `
              "../dist/DrawDock-$env:DRAWDOCK_VERSION-android.apk"
          } finally {
            Remove-Item -LiteralPath $env:DRAWDOCK_ANDROID_KEYSTORE -Force
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [version, windows, android]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Publish both platforms together
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $assets = @(Get-ChildItem dist -File | Sort-Object Name)
          if ($assets.Count -ne 4) { throw "Expected installer, portable ZIP, source ZIP and APK; got $($assets.Count)" }
          $checksums = $assets | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($checksums -join "`n") + "`n")
          $paths = @(Get-ChildItem dist -File | ForEach-Object FullName)
          & gh release create $env:RELEASE_TAG @paths --verify-tag `
            --title "DrawDock $env:RELEASE_VERSION" --generate-notes `
            --notes-file packaging/release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
